[workspace]

members  = ["zdu"]
resolver = "2"

[workspace.dependencies]

# Workspace members
zdu = { path = "zdu" }

app-error         = "0.1.1"
chrono            = "0.4.45"
clap              = "4.6.4"
clap_complete     = "4.6.8"
derive_more       = "2.1.1"
extend            = "1.2.0"
humansize         = "2.1.3"
itertools         = "0.15.0"
md5               = "0.8.1"
memchr            = "2.8.3"
owo-colors        = "4.3.0"
postcard          = "1.1.3"
serde             = "1.0.229"
strum             = "0.28.0"
thiserror         = "2.0.20"
tracing           = "0.1.44"
tracing-indicatif = "0.3.14"
zutil-logger      = "0.1.0"

[workspace.lints]

clippy.nursery  = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }

# Must use `expect` instead of `unwrap`
clippy.unwrap_used = "deny"

# Improve unsafe usage
clippy.multiple_unsafe_ops_per_block = "warn"
clippy.undocumented_unsafe_blocks    = "warn"

# Style
clippy.match_bool           = "allow"
clippy.option_if_let_else   = "allow"
clippy.single_match_else    = "allow"
clippy.tabs_in_doc_comments = "allow"

# Misc.
clippy.missing_errors_doc     = "allow"
clippy.similar_names          = "allow"
clippy.struct_excessive_bools = "allow"

# They are only confusing if used before their definition
clippy.items_after_statements = "allow"
